# Windows, built and tested on GitHub's runner: the way the code is checked on a platform nobody
# develops on. Plan: docs/plans/windows.md.
#
# A check like the others: a failure fails the run. (Make it required for merging in the repository's
# branch protection.) Scope so far: the library and the unit tests, the sockets and the soak (CPU only;
# a runner has no GPU). Drawing is tried by hand on a Windows machine.
name: windows

on:
  push:
    branches: [main]
    paths: &paths
      - "include/**"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "!examples/**/*.md"   # a README is not a build
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/windows.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Files exactly as committed: the golden physics recording and the .data files are binary.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # Only external/: the dependencies the library and tests need. The examples' own submodules
      # (Assimp, Lua, ...) are for the examples, which this does not build yet.
      - name: Dependencies (submodules)
        run: git submodule update --init --recursive --depth 1 external

      - name: GLFW
        run: vcpkg install glfw3:x64-windows

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake --preset windows
          -DCMAKE_PREFIX_PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"

      - name: Build
        # -k 0: keep going past a failed file, so one run lists every error rather than the first.
        run: cmake --build --preset windows --target projv_unit_tests -- -k 0

      # glfw3.dll is beside vcpkg's other binaries, not the test.
      - name: Test
        env:
          PROJV_GOLDEN_OUT: ${{ github.workspace }}/build-windows/golden-out   # what the golden test saves if it differs
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ctest --preset windows

      # Real sockets on localhost (ENet over Winsock), and the physics soak: ten simulated minutes, 2000 bodies.
      # The bash self-tests of the examples are not run here (tests/unit/CMakeLists.txt).
      - name: Test (sockets)
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ctest --preset windows-net

      - name: Test (physics soak)
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ctest --preset windows-soak

      # The recordings this build made, for comparing with tests/unit/data/ (only there if they differ).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-recordings
          path: build-windows/golden-out
          if-no-files-found: ignore

  # Every example, and the shaders they draw with, built with MSVC; and the ones the hand check uses, packaged as
  # an artifact to download and run on a Windows machine with a GPU (docs/plans/windows.md, W3 and W4). Nothing
  # runs here: a runner has no GPU.
  examples:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: No line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # external/ and the examples' own: Assimp (the mesh voxelizer) and Lua (the scene editor, the terrain baker).
      - name: Dependencies (submodules)
        run: git submodule update --init --recursive --depth 1 external examples/20-mesh-voxelizer/external examples/60-scene-editor/external

      - name: GLFW
        run: vcpkg install glfw3:x64-windows

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake --preset windows-examples
          -DCMAKE_PREFIX_PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"

      # -k 0: keep going past a failed file, so one run lists every error.
      - name: Build
        run: cmake --build --preset windows-examples -- -k 0

      # A folder per program, runnable on a machine with nothing installed: GLFW's DLL and the Visual C++
      # runtime (app-local, which Microsoft allows) beside each. Only the programs the hand check uses.
      - name: Package
        shell: pwsh
        run: |
          $programs = 'hello_voxel', 'renderer_gallery', 'voxel_mayhem_demo', 'terrain_generator', 'sandbox', 'physics'
          $out = 'dist/projectv-windows'
          New-Item -ItemType Directory -Force $out | Out-Null
          $glfw = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/glfw3.dll"
          $runtime = Get-ChildItem "$env:VCToolsRedistDir/x64/Microsoft.VC*.CRT/*.dll"
          foreach ($name in $programs) {
            $source = "build-windows-examples/examples/$name"
            $dest = "$out/$name"
            robocopy $source $dest /E /XD CMakeFiles /XF *.cmake *.ninja* *.obj *.ilk *.exp *.lib *.pdb /NFL /NDL /NJH /NJS /NP | Out-Null
            Copy-Item $glfw $dest
            Copy-Item $runtime $dest
          }
          Copy-Item .github/windows-package/README.txt $out/README.txt
          "ProjectV $env:GITHUB_SHA ($env:GITHUB_REF_NAME), built $(Get-Date -Format u)" | Set-Content $out/VERSION.txt
          Get-ChildItem $out -Directory | ForEach-Object { '{0,-20} {1,8:N0} MB' -f $_.Name, ((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB) }
          $global:LASTEXITCODE = 0   # robocopy's 1-7 mean "copied something"

      - uses: actions/upload-artifact@v4
        with:
          name: projectv-windows
          path: dist/projectv-windows
          retention-days: 14
