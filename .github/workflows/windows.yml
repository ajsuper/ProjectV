# Windows, built and tested on GitHub's runner: the way the code is checked on a platform nobody
# develops on. Plan: docs/plans/windows.md.
#
# NOT YET A GATE (continue-on-error): until the build is green it is the list of what breaks. Once it
# is, delete `continue-on-error` and it blocks pull requests like any check. Scope so far: the library
# and the unit tests (CPU only; a runner has no GPU). Drawing is tried by hand on a Windows machine.
name: windows

on:
  push:
    branches: [main]
    paths: &paths
      - "include/**"
      - "src/**"
      - "tests/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/windows.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    runs-on: windows-latest
    continue-on-error: true   # see the top: remove when green
    timeout-minutes: 90
    steps:
      # Files exactly as committed: the golden physics recording and the .data files are binary.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # Only external/: the dependencies the library and tests need. The examples' own submodules
      # (Assimp, Lua, ...) are for the examples, which this does not build yet.
      - name: Dependencies (submodules)
        run: git submodule update --init --recursive --depth 1 external

      - name: GLFW
        run: vcpkg install glfw3:x64-windows

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake --preset windows
          -DCMAKE_PREFIX_PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"

      - name: Build
        # -k 0: keep going past a failed file, so one run lists every error rather than the first.
        run: cmake --build --preset windows --target projv_unit_tests -- -k 0

      # glfw3.dll is beside vcpkg's other binaries, not the test.
      - name: Test
        env:
          PROJV_GOLDEN_OUT: ${{ github.workspace }}/build-windows/golden-out   # what the golden test saves if it differs
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ctest --preset windows

      # A character-controller test crashes about half of the runs, in a different test each time, with nothing
      # to say why (docs/plans/windows.md). Run them over and over, and print every crash report (main.cpp's:
      # the exception, where, a stack), so one CI run is enough to see it.
      - name: Hunt the character crash
        if: always()
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          $failed = 0
          for ($i = 1; $i -le 25; $i++) {
            $out = & build-windows/bin/projv_unit_tests.exe "-tc=*character*,groups*,physics loading*,*walk*" 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { $failed++; Write-Host "run $i failed (exit $LASTEXITCODE)"; Write-Host ($out -split "`n" | Select-String "CRASH|TEST CASE|ERROR" | Out-String) }
          }
          Write-Host "$failed of 25 runs failed"

      # The recordings this build made, for comparing with tests/unit/data/ (only there if they differ).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-recordings
          path: build-windows/golden-out
          if-no-files-found: ignore
